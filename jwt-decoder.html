<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JWT Decoder | DevToolBox</title><meta name="description" content="Decode JWT header and payload locally. Signature verification is not performed."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>JWT Decoder</h1><p>Decode JWT header and payload locally. Signature verification is not performed.</p></div><div class="panel"><div class="toolbar"><button id="run">Decode JWT</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="clear">Clear</button></div><span class="label">JWT token</span><textarea id="input" class="small"></textarea><div class="editor-grid" style="margin-top:15px"><div><span class="label">Header</span><textarea id="header" class="small" readonly></textarea></div><div><span class="label">Payload</span><textarea id="payload" class="small" readonly></textarea></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>$("#run").onclick=()=>{try{let p=$("#input").value.trim().split(".");if(p.length!==3)throw Error("JWT must contain 3 parts.");$("#header").value=JSON.stringify(JSON.parse(b64(p[0])),null,2);$("#payload").value=JSON.stringify(JSON.parse(b64(p[1])),null,2);status("Decoded locally. Signature was not verified.","success")}catch(e){status(e.message,"error")}};$("#sample").onclick=()=>{let h=btoa(JSON.stringify({alg:"none",typ:"JWT"})).replace(/=/g,''),p=btoa(JSON.stringify({sub:"123",name:"Demo",iat:Math.floor(Date.now()/1000)})).replace(/=/g,'');$("#input").value=h+"."+p+".";$("#run").click()};$("#clear").onclick=()=>{$("#input").value=$("#header").value=$("#payload").value='';status('')};</script></body></html>
