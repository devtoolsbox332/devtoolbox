<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Minifier | DevToolBox</title><meta name="description" content="Minify valid JSON and see how many characters you save."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>JSON Minifier</h1><p>Minify valid JSON and see how many characters you save.</p></div><div class="panel"><div class="toolbar"><button id="run">Minify JSON</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="load">Open file</button><button class="secondary" id="copy">Copy output</button><button class="secondary" id="download">Download</button></div><div class="editor-grid"><div><span class="label">Input</span><textarea id="input"></textarea></div><div><span class="label">Minified output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div><div id="stats" class="stats"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>const inp=$("#input"),out=$("#output");function run(){try{out.value=JSON.stringify(JSON.parse(inp.value));let saved=inp.value.length-out.value.length;status("Minified successfully.","success");$("#stats").innerHTML=`<span class="stat">Before: <b>${inp.value.length}</b></span><span class="stat">After: <b>${out.value.length}</b></span><span class="stat">Saved: <b>${saved}</b> chars</span>`}catch(e){out.value='';status("Invalid JSON: "+e.message,"error")}}$("#run").onclick=run;$("#sample").onclick=()=>{inp.value=JSON.stringify({name:"DevToolBox",features:["format","validate","minify"],settings:{private:true,free:true}},null,2);run()};$("#load").onclick=()=>loadFile(t=>{inp.value=t;run()});$("#copy").onclick=()=>copyText(out.value);$("#download").onclick=()=>downloadText("minified.json",out.value,"application/json");</script></body></html>
