<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Minifier | DevToolBox</title><meta name="description" content="Minify valid JSON and see how many characters you save."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>JSON Minifier</h1><p>Minify valid JSON and see exactly how many characters you save.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><button id="run">Minify JSON</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="load">Open file</button><button class="secondary" id="copy">Copy output</button><button class="secondary" id="download">Download</button></div><div class="editor-grid"><div><span class="label">Input</span><textarea id="input"></textarea></div><div><span class="label">Minified output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div><div id="stats" class="stats"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
const inp=$("#input"),out=$("#output");
function run(){
  try{
    out.value=JSON.stringify(JSON.parse(inp.value));
    let saved=inp.value.length-out.value.length;
    let pct=inp.value.length?Math.round(saved/inp.value.length*100):0;
    status("Minified successfully.","success");
    $("#stats").innerHTML=`<span class="stat">Before: <b>${inp.value.length}</b></span><span class="stat">After: <b>${out.value.length}</b></span><span class="stat">Saved: <b>${saved}</b> chars (${pct}%)</span>`;
  }catch(e){out.value='';status("Invalid JSON: "+e.message,"error")}
}
$("#run").onclick=run;
$("#sample").onclick=()=>{inp.value=JSON.stringify({name:"DevToolBox",features:["format","validate","minify"],settings:{private:true,free:true}},null,2);run()};
$("#load").onclick=()=>loadFile(t=>{inp.value=t;run()});
enableDrop(inp,t=>{inp.value=t;run()});
$("#copy").onclick=()=>copyText(out.value,$("#copy"));
$("#download").onclick=()=>downloadText("minified.json",out.value,"application/json");
</script></body></html>
