<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Timestamp Converter | DevToolBox</title><meta name="description" content="Convert Unix seconds or milliseconds to local time and UTC, and dates back to timestamps."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>Unix Timestamp Converter</h1><p>Convert Unix seconds or milliseconds to local time and UTC, and dates back to timestamps.</p></div><div class="panel"><div class="two"><div class="result"><span class="label">Unix → Date</span><input id="ts" class="input" placeholder="1755000000"><button id="from" style="margin-top:10px">Convert</button><div id="fromOut"></div></div><div class="result"><span class="label">Date → Unix</span><input id="date" class="input" type="datetime-local"><button id="to" style="margin-top:10px">Convert</button><div id="toOut"></div></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>$("#from").onclick=()=>{let n=Number($("#ts").value);if(!Number.isFinite(n))return status("Enter a valid timestamp.","error");let ms=Math.abs(n)<1e11?n*1000:n,d=new Date(ms);if(isNaN(d.getTime()))return status("Invalid timestamp.","error");$("#fromOut").innerHTML=`<p><b>Local:</b> ${d}</p><p><b>UTC:</b> ${d.toISOString()}</p><p><b>Milliseconds:</b> ${ms}</p>`;status("Converted.","success")};$("#to").onclick=()=>{let d=new Date($("#date").value);if(isNaN(d.getTime()))return status("Invalid date.","error");$("#toOut").innerHTML=`<p><b>Unix seconds:</b> ${Math.floor(d.getTime()/1000)}</p><p><b>Unix milliseconds:</b> ${d.getTime()}</p>`;status("Converted.","success")};$("#date").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);</script></body></html>
