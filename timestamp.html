<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unix Timestamp Converter | DevToolBox</title><meta name="description" content="Convert Unix seconds or milliseconds to local time and UTC, and dates back to timestamps."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>Unix Timestamp Converter</h1><p>Convert Unix seconds or milliseconds to local time and UTC, and dates back to timestamps.</p></div></div><main class="container tool"><div class="panel"><div class="two"><div class="result"><span class="label">Unix &rarr; Date</span><input id="ts" class="input" placeholder="1755000000"><div class="toolbar" style="margin-top:10px"><button id="from">Convert</button><button class="secondary" id="now">Now</button></div><div id="fromOut"></div></div><div class="result"><span class="label">Date &rarr; Unix</span><input id="date" class="input" type="datetime-local"><div class="toolbar" style="margin-top:10px"><button id="to">Convert</button></div><div id="toOut"></div></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
$("#from").onclick=()=>{
  let n=Number($("#ts").value);
  if(!Number.isFinite(n))return status("Enter a valid timestamp.","error");
  let ms=Math.abs(n)<1e11?n*1000:n,d=new Date(ms);
  if(isNaN(d.getTime()))return status("Invalid timestamp.","error");
  let rel=Math.round((ms-Date.now())/1000);
  let abs=Math.abs(rel),unit=abs<60?"seconds":abs<3600?"minutes":abs<86400?"hours":"days";
  let val=abs<60?abs:abs<3600?Math.round(abs/60):abs<86400?Math.round(abs/3600):Math.round(abs/86400);
  let relTxt=rel<0?`${val} ${unit} ago`:`in ${val} ${unit}`;
  $("#fromOut").innerHTML=`<p><b>Local:</b> ${d}</p><p><b>UTC:</b> ${d.toISOString()}</p><p><b>Relative:</b> ${relTxt}</p><p><b>Milliseconds:</b> ${ms}</p>`;
  status("Converted.","success");
};
$("#now").onclick=()=>{$("#ts").value=Math.floor(Date.now()/1000);$("#from").click()};
$("#to").onclick=()=>{
  let d=new Date($("#date").value);
  if(isNaN(d.getTime()))return status("Invalid date.","error");
  $("#toOut").innerHTML=`<p><b>Unix seconds:</b> ${Math.floor(d.getTime()/1000)}</p><p><b>Unix milliseconds:</b> ${d.getTime()}</p>`;
  status("Converted.","success");
};
$("#date").value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
</script></body></html>
