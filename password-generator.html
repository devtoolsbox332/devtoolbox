<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator | DevToolBox</title><meta name="description" content="Generate strong, cryptographically random passwords with full control over character sets."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">NEW · FREE BROWSER TOOL</span><h1>Password Generator</h1><p>Generate strong, cryptographically random passwords with full control over character sets.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><label class="label">Length <input id="length" type="number" min="4" max="128" value="20" style="width:90px"></label><label class="checkrow"><input type="checkbox" id="upper" checked> A-Z</label><label class="checkrow"><input type="checkbox" id="lower" checked> a-z</label><label class="checkrow"><input type="checkbox" id="digits" checked> 0-9</label><label class="checkrow"><input type="checkbox" id="symbols" checked> !@#$</label><label class="checkrow"><input type="checkbox" id="excludeAmbig"> Exclude ambiguous (l1IoO0)</label></div><div class="toolbar"><button id="run">Generate</button><label class="label">How many <input id="count" type="number" min="1" max="50" value="1" style="width:80px"></label><button class="secondary" id="copy">Copy</button></div><textarea id="output" class="tiny"></textarea><div class="strength"><i id="bar"></i></div><div id="strengthLabel" class="hint"></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
const SETS={upper:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",lower:"abcdefghijklmnopqrstuvwxyz",digits:"0123456789",symbols:"!@#$%^&*()-_=+[]{};:,.<>?"};
const AMBIG="l1IoO0";
function genOne(len,chars){
  let arr=new Uint32Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr,x=>chars[x%chars.length]).join("");
}
function score(pw){
  let pool=0;
  if(/[a-z]/.test(pw))pool+=26;
  if(/[A-Z]/.test(pw))pool+=26;
  if(/[0-9]/.test(pw))pool+=10;
  if(/[^a-zA-Z0-9]/.test(pw))pool+=32;
  let bits=pw.length*Math.log2(Math.max(pool,1));
  return bits;
}
function run(){
  let chars="";
  ["upper","lower","digits","symbols"].forEach(k=>{if($("#"+k).checked)chars+=SETS[k]});
  if($("#excludeAmbig").checked)chars=chars.split("").filter(c=>!AMBIG.includes(c)).join("");
  if(!chars)return status("Select at least one character set.","error");
  let len=Math.min(128,Math.max(4,Number($("#length").value)||20));
  let count=Math.min(50,Math.max(1,Number($("#count").value)||1));
  let list=Array.from({length:count},()=>genOne(len,chars));
  $("#output").value=list.join("\n");
  let bits=score(list[0]);
  let pct=Math.min(100,Math.round(bits/128*100));
  $("#bar").style.width=pct+"%";
  $("#bar").style.background=pct<35?"var(--error)":pct<65?"#f59e0b":"var(--success)";
  $("#strengthLabel").textContent=`~${Math.round(bits)} bits of entropy per password \u2014 ${pct<35?"weak":pct<65?"reasonable":"strong"}`;
  status(`Generated ${count} password(s).`,"success");
}
$("#run").onclick=run;
["length","count","upper","lower","digits","symbols","excludeAmbig"].forEach(id=>$("#"+id).addEventListener("input",run));
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
run();
</script></body></html>
