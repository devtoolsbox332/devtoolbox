<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON to CSV Converter | DevToolBox</title><meta name="description" content="Convert a JSON array of objects to correctly quoted CSV."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>JSON to CSV Converter</h1><p>Convert a JSON array of objects to correctly quoted CSV.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><button id="run">Convert</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="load">Open file</button><button class="secondary" id="copy">Copy CSV</button><button class="secondary" id="download">Download CSV</button></div><div class="editor-grid"><div><span class="label">JSON array</span><textarea id="input"></textarea></div><div><span class="label">CSV output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
$("#run").onclick=()=>{
  try{
    let a=JSON.parse($("#input").value);
    if(!Array.isArray(a)||!a.length||a.some(x=>!x||typeof x!=="object"||Array.isArray(x)))
      throw Error("Expected a non-empty JSON array of objects.");
    let keys=[...new Set(a.flatMap(Object.keys))];
    let lines=[keys.map(csvEsc).join(",")];
    a.forEach(o=>lines.push(keys.map(k=>csvEsc(o[k]&&typeof o[k]==="object"?JSON.stringify(o[k]):o[k])).join(",")));
    $("#output").value=lines.join("\n");
    status("Converted successfully.","success");
  }catch(e){$("#output").value='';status(e.message,"error")}
};
$("#sample").onclick=()=>{$("#input").value=JSON.stringify([{name:"Alice",age:30},{name:"Bob",age:25}],null,2);$("#run").click()};
$("#load").onclick=()=>loadFile(t=>{$("#input").value=t;$("#run").click()});
enableDrop($("#input"),t=>{$("#input").value=t;$("#run").click()});
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
$("#download").onclick=()=>downloadText("data.csv",$("#output").value,"text/csv");
</script></body></html>
