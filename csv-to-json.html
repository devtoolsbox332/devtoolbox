<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV to JSON Converter | DevToolBox</title><meta name="description" content="Convert CSV with quoted fields and commas into JSON objects."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>CSV to JSON Converter</h1><p>Convert CSV with quoted fields and commas into JSON objects.</p></div><div class="panel"><div class="toolbar"><button id="run">Convert</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="copy">Copy JSON</button><button class="secondary" id="download">Download JSON</button></div><div class="editor-grid"><div><span class="label">CSV input</span><textarea id="input" placeholder="name,age
Alice,30
Bob,25"></textarea></div><div><span class="label">JSON output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>$("#run").onclick=()=>{try{let r=csvRows($("#input").value.trim());if(r.length<2)throw Error("Provide headers and at least one data row.");let h=r[0];if(h.some(x=>!x.trim()))throw Error("Headers cannot be empty.");$("#output").value=JSON.stringify(r.slice(1).map(row=>Object.fromEntries(h.map((k,i)=>[k,row[i]??""]))),null,2);status("Converted successfully.","success")}catch(e){status(e.message,"error")}};$("#sample").onclick=()=>{$("#input").value="name,age,city
Alice,30,Hyderabad
Bob,25,Delhi";$("#run").click()};$("#copy").onclick=()=>copyText($("#output").value);$("#download").onclick=()=>downloadText("data.json",$("#output").value,"application/json");</script></body></html>
