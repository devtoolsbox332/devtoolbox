<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV to JSON Converter | DevToolBox</title><meta name="description" content="Convert CSV with quoted fields and commas into JSON objects."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>CSV to JSON Converter</h1><p>Convert CSV with quoted fields and commas into JSON objects.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><button id="run">Convert</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="load">Open file</button><label class="checkrow"><input type="checkbox" id="asArray"> Output as arrays</label><button class="secondary" id="copy">Copy JSON</button><button class="secondary" id="download">Download JSON</button></div><div class="editor-grid"><div><span class="label">CSV input</span><textarea id="input" placeholder="name,age&#10;Alice,30&#10;Bob,25"></textarea></div><div><span class="label">JSON output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
$("#run").onclick=()=>{
  try{
    let r=csvRows($("#input").value.trim());
    if(r.length<2)throw Error("Provide headers and at least one data row.");
    let h=r[0];
    if(h.some(x=>!x.trim()))throw Error("Headers cannot be empty.");
    let rows=r.slice(1);
    let result=$("#asArray").checked?rows:rows.map(row=>Object.fromEntries(h.map((k,i)=>[k,row[i]??""])));
    $("#output").value=JSON.stringify(result,null,2);
    status("Converted successfully.","success");
  }catch(e){status(e.message,"error")}
};
$("#sample").onclick=()=>{$("#input").value="name,age,city\nAlice,30,Hyderabad\nBob,25,Delhi";$("#run").click()};
$("#load").onclick=()=>loadFile(t=>{$("#input").value=t;$("#run").click()});
enableDrop($("#input"),t=>{$("#input").value=t;$("#run").click()});
$("#asArray").onchange=()=>$("#run").click();
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
$("#download").onclick=()=>downloadText("data.json",$("#output").value,"application/json");
</script></body></html>
