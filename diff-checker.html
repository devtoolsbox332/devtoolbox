<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Diff Checker | DevToolBox</title><meta name="description" content="Compare two text blocks line by line and show changed lines."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>Text Diff Checker</h1><p>Compare two text blocks line by line and show changed lines.</p></div></div><main class="container tool"><div class="panel"><div class="editor-grid"><div><span class="label">Original</span><textarea id="a"></textarea></div><div><span class="label">Modified</span><textarea id="b"></textarea></div></div><div class="toolbar"><button id="run">Compare</button><label class="checkrow"><input type="checkbox" id="ignoreCase"> Ignore case</label><label class="checkrow"><input type="checkbox" id="ignoreWs"> Ignore whitespace</label><button class="secondary" id="clear">Clear</button></div><div id="status" class="status"></div><div id="result" class="result"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
$("#run").onclick=()=>{
  let norm=s=>{
    if($("#ignoreWs").checked)s=s.trim().replace(/\s+/g," ");
    if($("#ignoreCase").checked)s=s.toLowerCase();
    return s;
  };
  let a=$("#a").value.split(/\r?\n/),b=$("#b").value.split(/\r?\n/);
  let n=Math.max(a.length,b.length),d=[];
  for(let i=0;i<n;i++){
    let av=a[i]??"",bv=b[i]??"";
    if(norm(av)!==norm(bv))d.push(`Line ${i+1}\n\u2212 ${a[i]??"<missing>"}\n+ ${b[i]??"<missing>"}`);
  }
  $("#result").textContent=d.join("\n\n")||"No differences. The texts are identical.";
  status(d.length?`${d.length} changed line(s).`:"Texts are identical.",d.length?"":"success");
};
$("#clear").onclick=()=>{$("#a").value=$("#b").value=$("#result").textContent="";status("")};
</script></body></html>
