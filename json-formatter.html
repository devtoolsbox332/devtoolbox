.stringify(v,null,+$("#indent").value);status("Valid JSON formatted successfully.","success");$("#stats").innerHTML=`<span class="stat">Input: <b>${inp.value.length}</b> chars</span><span class="stat">Output: <b>${out.value.length}</b> chars</span>`}catch(e){out.value="";status("Invalid JSON: "+e.message,"error")}}$("#run").onclick=run;$("#sample").onclick=()=>{inp.value=JSON.stringify({name:"DevToolBox",version:3,features:["format","validate","minify"],settings:{private:true,free:true}},null,2);run()};$("#load").onclick=()=>loadFile(t=>{inp.value=t;run()});$("#copy").onclick=()=>copyText(out.value);$("#download").onclick=()=>downloadText("formatted.json",out.value,"application/json");</script></body></html>
