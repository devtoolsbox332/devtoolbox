<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder & Decoder | DevToolBox</title><meta name="description" content="Encode and decode UTF-8 text correctly, including Unicode."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>Base64 Encoder & Decoder</h1><p>Encode and decode UTF-8 text correctly, including Unicode.</p></div><div class="panel"><div class="toolbar"><button id="enc">Encode</button><button id="dec">Decode</button><button class="secondary" id="copy">Copy</button><button class="secondary" id="clear">Clear</button></div><div class="editor-grid"><div><span class="label">Input</span><textarea id="input"></textarea></div><div><span class="label">Output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>$("#enc").onclick=()=>{try{let b=new TextEncoder().encode($("#input").value),s='';b.forEach(x=>s+=String.fromCharCode(x));$("#output").value=btoa(s);status("Encoded UTF-8 text.","success")}catch(e){status(e.message,"error")}};$("#dec").onclick=()=>{try{let b=atob($("#input").value.trim()),a=Uint8Array.from(b,c=>c.charCodeAt(0));$("#output").value=new TextDecoder().decode(a);status("Decoded successfully.","success")}catch(e){status("Invalid Base64 input.","error")}};$("#copy").onclick=()=>copyText($("#output").value);$("#clear").onclick=()=>{$("#input").value=$("#output").value='';status('')};</script></body></html>
