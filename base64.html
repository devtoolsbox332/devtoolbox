Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
function toUrlSafe(s){return s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
$("#enc").onclick=()=>{
  try{
    let b=new TextEncoder().encode($("#input").value),s="";
    b.forEach(x=>s+=String.fromCharCode(x));
    let out=btoa(s);
    if($("#urlSafe").checked)out=toUrlSafe(out);
    $("#output").value=out;
    status("Encoded UTF-8 text.","success");
  }catch(e){status(e.message,"error")}
};
$("#dec").onclick=()=>{
  try{
    $("#output").value=b64($("#input").value.trim());
    status("Decoded successfully.","success");
  }catch(e){status("Invalid Base64 input.","error")}
};
$("#load").onclick=()=>loadFile(t=>$("#input").value=t);
enableDrop($("#input"),t=>$("#input").value=t);
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
$("#clear").onclick=()=>{$("#input").value=$("#output").value="";status("")};
</script></body></html>
