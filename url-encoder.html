<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder & Decoder | DevToolBox</title><meta name="description" content="Encode or decode URL components safely, including Unicode."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>URL Encoder & Decoder</h1><p>Encode or decode URL components safely, including Unicode, and inspect full URLs.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><button id="enc">Encode</button><button id="dec">Decode</button><button class="secondary" id="parse">Parse URL</button><button class="secondary" id="copy">Copy</button><button class="secondary" id="clear">Clear</button></div><div class="editor-grid"><div><span class="label">Input</span><textarea id="input"></textarea></div><div><span class="label">Output</span><textarea id="output" readonly></textarea></div></div><div id="status" class="status"></div><div id="parts" class="stats"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
$("#enc").onclick=()=>{
  try{$("#output").value=encodeURIComponent($("#input").value);status("Encoded.","success");$("#parts").innerHTML=""}
  catch(e){status(e.message,"error")}
};
$("#dec").onclick=()=>{
  try{$("#output").value=decodeURIComponent($("#input").value);status("Decoded.","success");$("#parts").innerHTML=""}
  catch(e){status("Invalid URL encoding.","error")}
};
$("#parse").onclick=()=>{
  try{
    let u=new URL($("#input").value);
    let bits=[["Protocol",u.protocol],["Host",u.host],["Pathname",u.pathname],["Query",u.search||"(none)"],["Hash",u.hash||"(none)"]];
    $("#parts").innerHTML=bits.map(([k,v])=>`<span class="stat">${k}: <b>${escapeHtml(v)}</b></span>`).join("");
    let params=[...u.searchParams.entries()];
    $("#output").value=params.length?params.map(([k,v])=>`${k} = ${v}`).join("\n"):"(no query parameters)";
    status("Parsed URL.","success");
  }catch(e){status("Enter a full, valid URL (including https://).","error")}
};
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
$("#clear").onclick=()=>{$("#input").value=$("#output").value="";$("#parts").innerHTML="";status("")};
</script></body></html>
