<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>UUID Generator | DevToolBox</title><meta name="description" content="Generate cryptographically random UUID v4 identifiers."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">FREE BROWSER TOOL</span><h1>UUID Generator</h1><p>Generate cryptographically random UUID v4 identifiers.</p></div></div><main class="container tool"><div class="panel"><div class="toolbar"><label class="label">Count <input id="count" type="number" min="1" max="1000" value="10" style="width:100px"></label><label class="checkrow"><input type="checkbox" id="upper"> Uppercase</label><label class="checkrow"><input type="checkbox" id="noHyphen"> No hyphens</label><label class="checkrow"><input type="checkbox" id="braces"> Braces</label><button id="run">Generate</button><button class="secondary" id="copy">Copy</button><button class="secondary" id="download">Download</button></div><textarea id="output"></textarea><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
function run(){
  let n=Math.min(1000,Math.max(1,Number($("#count").value)||1));
  let up=$("#upper").checked,noh=$("#noHyphen").checked,br=$("#braces").checked;
  let list=Array.from({length:n},()=>{
    let u=crypto.randomUUID();
    if(noh)u=u.replace(/-/g,"");
    if(up)u=u.toUpperCase();
    if(br)u="{"+u+"}";
    return u;
  });
  $("#output").value=list.join("\n");
  status(`Generated ${n} UUID(s).`,"success");
}
$("#run").onclick=run;
["upper","noHyphen","braces"].forEach(id=>$("#"+id).onchange=run);
$("#copy").onclick=()=>copyText($("#output").value,$("#copy"));
$("#download").onclick=()=>downloadText("uuids.txt",$("#output").value);
run();
</script></body></html>
