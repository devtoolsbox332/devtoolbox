<!doctype html><html lang="en"><head><meta charset="utf-8"><script>(function(){try{var t=localStorage.getItem('dtb-theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word & Character Counter | DevToolBox</title><meta name="description" content="Count words, characters, sentences and paragraphs, and estimate reading time."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><button class="navtoggle" id="navtoggle" aria-label="Menu">&#9776;</button><nav class="navlinks" id="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="hash-generator.html">Hash</a><a href="regex-tester.html">Regex</a><a href="about.html">About</a></nav><div class="navright"><button class="iconbtn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark mode">&#9680;</button></div></div></header><div class="toolhead"><div><span class="eyebrow">NEW · FREE BROWSER TOOL</span><h1>Word & Character Counter</h1><p>Count words, characters, sentences and paragraphs, and estimate reading time.</p></div></div><main class="container tool"><div class="panel"><span class="label">Text</span><textarea id="input" class="small" placeholder="Paste or type your text here..."></textarea><div id="stats" class="stats" style="margin-top:14px"></div><span class="label" style="margin-top:16px">Top keywords</span><div id="keywords" class="result"></div><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>&copy; 2026 DevToolBox &middot; Fast, simple browser tools</span><span><a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="index.html">All tools</a></span></div></footer><script src="common.js"></script><script>
const STOP=new Set(["the","a","an","and","or","but","is","are","was","were","be","to","of","in","on","for","with","this","that","it","as","at","by","from","i","you","he","she","they","we"]);
function update(){
  let t=$("#input").value;
  let chars=t.length,charsNoSpace=t.replace(/\s/g,"").length;
  let words=(t.trim().match(/\S+/g)||[]);
  let sentences=(t.match(/[^.!?]+[.!?]+/g)||(t.trim()?[t]:[]));
  let paragraphs=t.split(/\n\s*\n/).filter(p=>p.trim());
  let readMins=Math.max(1,Math.round(words.length/200));
  $("#stats").innerHTML=[
    ["Words",words.length],["Characters",chars],["Characters (no spaces)",charsNoSpace],
    ["Sentences",sentences.length],["Paragraphs",paragraphs.length||(t.trim()?1:0)],["Reading time",readMins+" min"]
  ].map(([k,v])=>`<span class="stat">${k}: <b>${v}</b></span>`).join("");
  let freq={};
  words.map(w=>w.toLowerCase().replace(/[^a-z0-9']/g,"")).filter(w=>w&&!STOP.has(w)).forEach(w=>freq[w]=(freq[w]||0)+1);
  let top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $("#keywords").textContent=top.length?top.map(([w,c])=>`${w} (${c})`).join(", "):"(no repeated keywords yet)";
  status("Updated live.","success");
}
$("#input").addEventListener("input",update);
update();
</script></body></html>
