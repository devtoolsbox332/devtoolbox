<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Validator | DevToolBox</title><meta name="description" content="Validate JSON syntax and get an immediate error message."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="brand" href="index.html"><span class="logo">&lt;/&gt;</span>DevToolBox</a><nav class="navlinks"><a href="index.html">All Tools</a><a href="json-formatter.html">JSON</a><a href="jwt-decoder.html">JWT</a><a href="regex-tester.html">Regex</a></nav></div></header><main class="container tool"><div class="toolhead"><span class="eyebrow">FREE BROWSER TOOL</span><h1>JSON Validator</h1><p>Validate JSON syntax and get an immediate error message.</p></div><div class="panel"><div class="toolbar"><button id="run">Validate JSON</button><button class="secondary" id="sample">Sample</button><button class="secondary" id="load">Open file</button><button class="secondary" id="clear">Clear</button></div><textarea id="input" placeholder='{"name":"DevToolBox"}'></textarea><div id="status" class="status"></div></div></main><footer><div class="container foot"><span>© 2026 DevToolBox · Fast, simple browser tools</span><span><a href="about.html">About</a> · <a href="privacy.html">Privacy</a></span></div></footer><script src="common.js"></script><script>$("#run").onclick=()=>{try{JSON.parse($("#input").value);status("✓ Valid JSON. No syntax errors found.","success")}catch(e){status("✕ Invalid JSON: "+e.message,"error")}};$("#sample").onclick=()=>$("#input").value=JSON.stringify({name:"DevToolBox",items:[1,2,3],active:true},null,2);$("#load").onclick=()=>loadFile(t=>$("#input").value=t);$("#clear").onclick=()=>{$("#input").value='';status('')};</script></body></html>
